<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>R.I.Planta</title>
  <!-- Fondo crema con borde de madera, como los paneles del prototipo retro. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#f5e0b8" stroke="#8b4513" stroke-width="4" />
  <!-- Tierra sobre la que se asienta la lápida. -->
  <rect x="12" y="50" width="40" height="4" rx="2" fill="#8b4513" />
  <!-- Lápida: rectángulo con tapa semircular. -->
  <path d="M20 51V29a12 12 0 0 1 24 0v22Z" fill="#2e1305" />
  <!-- Hoja, el glifo de la foto de cada lápida (iconos.tsx). -->
  <g transform="translate(21 27) scale(0.92)" fill="none" stroke="#dcf2e9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21c0-6 3-10 8-11-1 6-4 10-8 11Z" />
    <path d="M12 21c0-7-3-12-9-13 1 7 4 12 9 13Z" />
  </g>
</svg>
